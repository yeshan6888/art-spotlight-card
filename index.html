<body>

<footer class="foot"><span>浮光珍藏 · ROCOCO RELIEF CARDS</span><span>DRAG OR SWIPE TO EXPLORE</span></footer>

<script>
(()=>{'use strict';const root='./card/',cards=[{id:'art-nouveau-infp',title:'静谧书写者',en:'INFP · The Dreamer',description:'在花叶与墨香之间，收藏一段柔软而丰盛的想象。'},{id:'art-nouveau-isfp',title:'画室拾光',en:'ISFP · The Artist',description:'金色画框中的一束暖光，照亮正在生长的颜色。'},{id:'art-nouveau-reader',title:'玫瑰与典籍',en:'The Reader',description:'花朵环绕书页，古典纹样随着光线浮现。'},{id:'art-nouveau-writer',title:'灵感手札',en:'The Writer',description:'一笔一画之间，浮雕金线映出灵感的微光。'},{id:'rose-key',title:'玫瑰之钥',en:'The Rose Key',description:'玫瑰与钥匙交织成一件温润的古典饰物。'},{id:'woman-art-nouveau',title:'鎏金卷发',en:'Art Nouveau Portrait',description:'卷曲的发丝与花饰，在斜掠的烛光中层层显影。'}];const rail=document.querySelector('#rail'),viewer=document.querySelector('#viewer'),toast=document.querySelector('#toast'),tiles=[];let closeViewer=()=>{},activeIndex=0,scrollFrame=0,settleTimer=0,dragState=null,touchGesture=null,suppressClick=false;const copyCount=3,centerCopy=1;
for(let copy=0;copy<copyCount;copy++)cards.forEach((c,i)=>{const b=document.createElement('button');b.className='tile';b.type='button';b.dataset.realIndex=String(i);b.dataset.copy=String(copy);b.setAttribute('aria-label',`查看${c.title}`);if(copy!==centerCopy){b.setAttribute('aria-hidden','true');b.tabIndex=-1}b.innerHTML=`<div class="tile-art"><img src="${root+c.id}/card-original.png" alt="${c.title}" loading="lazy"></div>`;b.addEventListener('click',()=>{if(suppressClick){suppressClick=false;return}openCard(c,i)});tiles.push(b);rail.append(b)});
function setRailPadding(){if(!tiles.length)return;const side=Math.max(12,(rail.clientWidth-tiles[0].offsetWidth)/2);rail.style.paddingLeft=`${side}px`;rail.style.paddingRight=`${side}px`}
function targetScrollLeft(tile){const rr=rail.getBoundingClientRect(),tr=tile.getBoundingClientRect();return rail.scrollLeft+tr.left+tr.width/2-rr.left-rail.clientWidth/2}
function goTo(index,behavior='smooth'){activeIndex=((index%tiles.length)+tiles.length)%tiles.length;const left=targetScrollLeft(tiles[activeIndex]);if(behavior==='instant'){rail.classList.add('recenter');rail.scrollLeft=left;requestAnimationFrame(()=>{rail.classList.remove('recenter');requestActive()})}else rail.scrollTo({left,behavior:'smooth'});requestActive()}
function updateActive(){scrollFrame=0;if(!tiles.length)return;const center=rail.getBoundingClientRect().left+rail.clientWidth/2;let nearest=0,min=Infinity;tiles.forEach((tile,i)=>{const r=tile.getBoundingClientRect(),dist=Math.abs((r.left+r.width/2)-center),norm=dist/Math.max(tile.offsetWidth,1);if(dist<min){min=dist;nearest=i}tile.style.setProperty('--distance',Math.min(norm,1.5).toFixed(3))});tiles.forEach((tile,i)=>tile.classList.toggle('active',i===nearest));activeIndex=nearest}
function requestActive(){if(!scrollFrame)scrollFrame=requestAnimationFrame(updateActive)}
function blockWidth(){const gap=parseFloat(getComputedStyle(rail).columnGap)||0;return cards.length*(tiles[0].offsetWidth+gap)}
function shiftTrackBlock(shift){rail.classList.add('recenter');rail.scrollLeft+=shift*blockWidth();activeIndex+=shift*cards.length;requestAnimationFrame(()=>{rail.classList.remove('recenter');requestActive()})}function recenterLoop(){if(dragState)return;updateActive();let shift=0;if(activeIndex<cards.length)shift=1;else if(activeIndex>=cards.length*2)shift=-1;if(shift)shiftTrackBlock(shift)}function stepCarousel(direction){updateActive();if(direction<0&&activeIndex<cards.length)shiftTrackBlock(1);else if(direction>0&&activeIndex>=cards.length*2)shiftTrackBlock(-1);goTo(activeIndex+direction)}
function scheduleLoopRecenter(){clearTimeout(settleTimer);settleTimer=setTimeout(recenterLoop,180)}
rail.addEventListener('scroll',()=>{requestActive();scheduleLoopRecenter()},{passive:true});window.addEventListener('resize',()=>{setRailPadding();goTo(activeIndex,'instant')});rail.addEventListener('pointerdown',e=>{if(e.button!==0)return;if(e.pointerType==='mouse'){dragState={x:e.clientX,left:rail.scrollLeft,moved:false};rail.classList.add('dragging')}else if(e.pointerType==='touch')touchGesture={x:e.clientX,moved:false}});window.addEventListener('pointermove',e=>{if(dragState){const dx=e.clientX-dragState.x;if(Math.abs(dx)>5)dragState.moved=true;if(dragState.moved){rail.scrollLeft=dragState.left-dx;requestActive();scheduleLoopRecenter()}}if(touchGesture&&Math.abs(e.clientX-touchGesture.x)>8)touchGesture.moved=true});window.addEventListener('pointerup',()=>{if(dragState){const moved=dragState.moved;dragState=null;rail.classList.remove('dragging');if(moved){suppressClick=true;updateActive();goTo(activeIndex);setTimeout(()=>suppressClick=false,180)}}if(touchGesture){if(touchGesture.moved){suppressClick=true;setTimeout(()=>suppressClick=false,180)}touchGesture=null}});window.addEventListener('pointercancel',()=>{if(touchGesture?.moved){suppressClick=true;setTimeout(()=>suppressClick=false,180)}touchGesture=null;dragState=null;rail.classList.remove('dragging')});

function say(s){toast.textContent=s;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),3400)}
async function openCard(c,i){viewer.classList.add('open');document.body.style.overflow='hidden';const image=document.querySelector('#detailImage'),face=document.querySelector('#cardFace'),display=document.querySelector('#display'),shadow=document.querySelector('#cardShadow'),canvas=document.querySelector('#gl');image.src=`${root+c.id}/card-original.png`;image.alt=c.title;let gl,program,raf=0,ready=false,mouse={x:.5,y:.5},tilt={x:0,y:0},target={x:0,y:0},reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;let textures=[];const vertex=`#version 300 es\nin vec2 p;out vec2 uv;void main(){uv=p*.5+.5;gl_Position=vec4(p,0.,1.);}`;const fragment=`#version 300 es\nprecision highp float;in vec2 uv;out vec4 outColor;uniform sampler2D uColor,uNormal,uRough,uHeight;uniform vec2 uLight;uniform bool uParallax;void main(){vec2 p=uv;float h0=texture(uHeight,p).r;if(uParallax)p+=(p-uLight)*(h0-.5)*0.0034;vec4 base=texture(uColor,p);if(base.a<0.002){outColor=vec4(0.);return;}vec3 map=texture(uNormal,p).rgb*2.-1.;vec3 N=normalize(vec3(map.xy*1.45,max(map.z,.08)));vec3 L=normalize(vec3((uLight.x-.5)*2.,(.5-uLight.y)*2.,.5));float ndl=max(dot(N,L),0.);float wrap=ndl*.8+.2;float rough=texture(uRough,p).r;vec3 V=vec3(0.,0.,1.);vec3 H=normalize(L+V);float shininess=mix(52.,6.,rough);float spec=pow(max(dot(N,H),0.),shininess);spec*=(1.-rough*.85)*.46;float rim=pow(1.-max(N.z,0.),2.)*.12*(1.-ndl);vec3 col=base.rgb*(vec3(.82,.83,.88)*.56+vec3(1.,.92,.78)*wrap*.62)+vec3(1.,.92,.78)*(spec+rim);outColor=vec4(col*base.a,base.a);}`;
function sh(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s}function load(url,n){return new Promise((ok,no)=>{const im=new Image();im.onload=()=>{gl.activeTexture(gl.TEXTURE0+n);const t=gl.createTexture();textures.push(t);gl.bindTexture(gl.TEXTURE_2D,t);gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,1);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,im);ok(t)};im.onerror=()=>no(Error('贴图无法加载：'+url));im.src=url})}
try{const cfg=await fetch(`${root+c.id}/card-config.json`).then(r=>{if(!r.ok)throw Error('配置文件读取失败');return r.json()});const base=root+c.id+'/';image.src=base+cfg.assets.original.split('/').pop();await new Promise((ok,no)=>{image.onload=ok;image.onerror=no});face.style.setProperty('--ratio',`${image.naturalWidth}/${image.naturalHeight}`);face.style.width=`min(84vw,${image.naturalWidth/image.naturalHeight*88}svh)`;face.style.height=`min(88svh,${image.naturalHeight/image.naturalWidth*84}vw)`;gl=canvas.getContext('webgl2',{alpha:true,premultipliedAlpha:true,antialias:true});if(!gl)throw Error('当前浏览器不支持 WebGL2');program=gl.createProgram();gl.attachShader(program,sh(gl.VERTEX_SHADER,vertex));gl.attachShader(program,sh(gl.FRAGMENT_SHADER,fragment));gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));gl.useProgram(program);const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);const loc=gl.getAttribLocation(program,'p');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);const names=['original','normal','roughness','height'];await Promise.all(names.map((key,n)=>load(base+cfg.assets[key].split('/').pop(),n)));['uColor','uNormal','uRough','uHeight'].forEach((n,j)=>gl.uniform1i(gl.getUniformLocation(program,n),j));gl.enable(gl.BLEND);gl.blendFunc(gl.ONE,gl.ONE_MINUS_SRC_ALPHA);ready=true;const resize=()=>{const d=Math.min(devicePixelRatio||1,cfg.render.dprMax||1.5),r=face.getBoundingClientRect();canvas.width=Math.max(1,Math.round(r.width*d));canvas.height=Math.max(1,Math.round(r.height*d));gl.viewport(0,0,canvas.width,canvas.height)};const ro=new ResizeObserver(resize);ro.observe(face);resize();function pointer(e){const r=face.getBoundingClientRect();mouse.x=Math.max(cfg.pointer.uvMin,Math.min(cfg.pointer.uvMax,(e.clientX-r.left)/r.width));mouse.y=Math.max(cfg.pointer.uvMin,Math.min(cfg.pointer.uvMax,(e.clientY-r.top)/r.height));target.x=(mouse.y-.5)*cfg.tilt.maxDegrees*2;target.y=-(mouse.x-.5)*cfg.tilt.maxDegrees*2}face.addEventListener('pointermove',pointer);face.addEventListener('pointerleave',()=>{mouse={x:.5,y:.5};target={x:0,y:0}});let start=performance.now();function frame(t){raf=requestAnimationFrame(frame);const sway=reduced?0:Math.sin((t-start)*.00055)*cfg.tilt.idleSwayDegrees;tilt.x+=(target.x+sway-tilt.x)*cfg.tilt.ease;tilt.y+=(target.y+(reduced?0:Math.cos((t-start)*.00042)*cfg.tilt.idleSwayDegrees)-tilt.y)*cfg.tilt.ease;face.style.transform=`rotateX(${tilt.x}deg) rotateY(${tilt.y}deg)`;const dx=.5-mouse.x,dy=.5-mouse.y,l=Math.hypot(dx,dy);shadow.style.transform=`translate(calc(-50% + ${dx*55}px),calc(-50% + ${dy*62+18}px)) scale(${.95+Math.min(l,.7)*.12})`;shadow.style.opacity=String(.55+Math.min(l,.7)*.42);gl.useProgram(program);gl.uniform2f(gl.getUniformLocation(program,'uLight'),mouse.x,mouse.y);gl.uniform1i(gl.getUniformLocation(program,'uParallax'),reduced?0:1);gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT);gl.drawArrays(gl.TRIANGLE_STRIP,0,4)}requestAnimationFrame(frame);closeViewer=()=>{cancelAnimationFrame(raf);ro.disconnect();face.removeEventListener('pointermove',pointer);textures.forEach(t=>gl.deleteTexture(t));canvas.width=canvas.height=1;ready=false;};}catch(e){canvas.style.display='none';say(`静态原图模式：${e.message}`);closeViewer=()=>{canvas.style.display='block';canvas.width=canvas.height=1;ready=false;};}
}
function close(){closeViewer();viewer.classList.remove('open');document.body.style.overflow='';}document.querySelector('#close').onclick=close;viewer.addEventListener('click',e=>{if(e.target.closest('#cardFace')||e.target.closest('#close'))return;close()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&viewer.classList.contains('open'))close();if(!viewer.classList.contains('open')&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){e.preventDefault();stepCarousel(e.key==='ArrowRight'?1:-1)}});})();
</script></body></html>
